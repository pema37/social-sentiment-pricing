# docker-compose.yml
services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ssp_user
      POSTGRES_PASSWORD: ssp_password
      POSTGRES_DB: ssp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssp_user -d ssp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # AP-019: Added ENCRYPTION_KEY and JWT_SECRET_KEY — previously missing,
      # causing startup crash (Settings validator rejects empty values).
      # AP-019: Renamed SHOPIFY_API_KEY/SECRET → SHOPIFY_CLIENT_ID/SECRET to
      # match core/config.py field names. Wrong names caused Shopify OAuth to
      # silently use None for client credentials.
      - DATABASE_URL=postgresql://ssp_user:ssp_password@db:5432/ssp_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ENVIRONMENT=development
      - DEBUG=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID}
      - SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  # AP-019: Added Celery worker service — previously missing from docker-compose.
  # Without it, background tasks (sync, pricing, sentiment ingestion) never run
  # in the Docker stack. Uses the same image as backend (built once, run twice).
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A workers.celery_app worker
      --pool=prefork
      --concurrency=4
      --max-tasks-per-child=1000
      --without-gossip
      --without-mingle
      --prefetch-multiplier=1
      --loglevel=info
      -Q celery,sync,sentiment
    environment:
      - DATABASE_URL=postgresql://ssp_user:ssp_password@db:5432/ssp_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ENVIRONMENT=development
      - DEBUG=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID}
      - SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat (scheduler)
  # Runs scheduled tasks (sync verification, health checks, pricing generation).
  # IMPORTANT: Never scale this above 1 replica — duplicate beat processes
  # cause double-execution of every scheduled task.
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A workers.celery_app beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid
    environment:
      - DATABASE_URL=postgresql://ssp_user:ssp_password@db:5432/ssp_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ENVIRONMENT=development
      - DEBUG=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:


  