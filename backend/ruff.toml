# Ruff configuration for ActualPrice backend
# https://docs.astral.sh/ruff/

target-version = "py313"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line too long — handled by formatter
    "B008",    # function call in default arg — FastAPI Depends() pattern
    "B905",    # zip without strict — too noisy
    "SIM108",  # ternary operator — readability preference
    "RUF012",  # mutable class variables — SQLModel pattern
]

[lint.per-file-ignores]
"tests/*" = ["B", "SIM", "N"]  # Relax rules in test files
"alembic/*" = ["E", "F"]       # Auto-generated migration files

[lint.isort]
known-first-party = ["core", "db", "models", "routes", "schemas", "services"]

[format]
quote-style = "double"
indent-style = "space"