# Alembic configuration file for Social Sentiment Pricing project

[alembic]
# Path to migration scripts relative to this file
script_location = alembic

# Optional: prepend this path to sys.path
prepend_sys_path = .

# Separator for multiple paths (default: OS-dependent)
path_separator = os

# Database URL - update with your actual PostgreSQL connection string
# Example format:
# postgresql://username:password@host:port/dbname?sslmode=require
sqlalchemy.url = postgresql://neondb_owner:npg_AoPz1KXnDJ6L@ep-empty-butterfly-adqn1btm-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require

# Logging configuration for Alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
