[pytest]
# ---------------------------------------------------------------
# ActualPrice — Autonomous Pipeline Test Configuration
# VETROX AGENTIC 3.0 Submission
# ---------------------------------------------------------------

testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode for pytest-asyncio
asyncio_mode = auto

# Verbose by default with short traceback
addopts =
    -v
    --tb=short
    --strict-markers
    -x

# Custom markers
markers =
    asyncio: marks tests as async (auto-detected by pytest-asyncio)
    slow: marks tests that take >2s (deselect with '-m "not slow"')
    integration: marks full pipeline integration tests
    api: marks HTTP endpoint tests
    unit: marks pure unit tests

# Minimum Python version
minversion = 3.11

# Ignore deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pydantic.*


    