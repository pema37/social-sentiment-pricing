name: ActualPrice CI/CD

on:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AP-020: Normalised to 3.13 (matches ci.yml)
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # Backend: Linting & Type Checks
  # ──────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff lint check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy type check
        run: mypy . --ignore-missing-imports --no-error-summary || true

  # ──────────────────────────────────────────────
  # Backend: Pytest Suite
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: actualprice_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: actualprice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://actualprice_test:test_password@localhost:5432/actualprice_test
      REDIS_URL: redis://localhost:6379/0
      TESTING: "true"
      ENVIRONMENT: "test"
      SECRET_KEY: "test-secret-key-not-for-production-xx"
      # AP-020: JWT_SECRET_KEY must be 32+ chars
      JWT_SECRET_KEY: "test-jwt-secret-not-for-production-xx"
      GEMINI_API_KEY: "test-gemini-key"
      OPENAI_API_KEY: "test-openai-key"
      # AP-020: Corrected SHOPIFY_CLIENT_ID/SECRET (was SHOPIFY_API_KEY/SECRET)
      SHOPIFY_CLIENT_ID: "test-shopify-client-id"
      SHOPIFY_CLIENT_SECRET: "test-shopify-client-secret"
      # AP-020: ENCRYPTION_KEY must be a valid Fernet key stored as a repo secret.
      # Add CI_ENCRYPTION_KEY to GitHub repo secrets:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run full test suite
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --strict-markers \
            -x \
            --timeout=60 \
            2>&1 | tee test-results.txt

      - name: Run tests with coverage
        if: success()
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=html:coverage-html \
            --cov-fail-under=40 \
            -q \
            --timeout=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage-html/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.txt
          retention-days: 14

  # ──────────────────────────────────────────────
  # Frontend: Lint, Type Check & Tests
  # ──────────────────────────────────────────────
  frontend-checks:
    name: Frontend Lint, Types & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint check
        run: npx eslint . --max-warnings=0 || true

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest (if tests exist)
        run: |
          if [ -d "src/__tests__" ] || [ -d "tests" ] || find src -name "*.test.*" -o -name "*.spec.*" | head -1 | grep -q .; then
            npx vitest run --reporter=verbose
          else
            echo "⚠️  No frontend tests found yet — skipping Vitest"
          fi

      - name: Next.js build check
        run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          SKIP_ENV_VALIDATION: "true"

  # ──────────────────────────────────────────────
  # Pipeline Summary
  # ──────────────────────────────────────────────
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, frontend-checks]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== ActualPrice CI/CD Pipeline Summary ==="
          echo ""
          echo "Backend Lint:  ${{ needs.backend-lint.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend:      ${{ needs.frontend-checks.result }}"
          echo ""

          if [ "${{ needs.backend-tests.result }}" = "failure" ]; then
            echo "❌ BACKEND TESTS FAILED — this blocks deployment"
            exit 1
          fi

          if [ "${{ needs.backend-lint.result }}" = "failure" ]; then
            echo "⚠️  Backend lint failed — fix warnings"
          fi

          if [ "${{ needs.frontend-checks.result }}" = "failure" ]; then
            echo "⚠️  Frontend checks failed — review TypeScript/build errors"
          fi

          echo "✅ Pipeline complete"



          